<style>@keyframes spin{to{transform:rotate(360deg)}}.spin{width:60px;height:60px;background:#2f5bd3;animation:spin 2s linear infinite}</style><h1>Motion studies</h1><div class="spin" aria-label="Spinning square"></div><canvas id="c" width="300" height="150" aria-label="Animated chart"></canvas><section><h2>Generative art</h2><p>Small experiments with canvas and easing.</p></section><script>const c=document.getElementById("c").getContext("2d");let t=0;(function f(){c.clearRect(0,0,300,150);c.fillStyle="#c62828";c.fillRect(10+((t++)%250),60,40,40);requestAnimationFrame(f)})()</script>
